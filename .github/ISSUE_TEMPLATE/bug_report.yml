name: 缺陷反馈
description: 报告 CAD 插件异常、卡顿或绘图错误
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请使用可公开的小样本。不要粘贴 API 密钥、models.json、完整诊断日志或未获授权的图纸。
  - type: input
    id: version
    attributes:
      label: 插件与 CAD 版本
      placeholder: AI 1.3.1 / AutoCAD 2024 / Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期结果和实际结果
      description: 卡顿请注明鼠标移动、选择、缩放、PDF 导入或 AI 执行哪个阶段出现。
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: 可公开的最小样例或错误提示
      description: 请先遮盖图纸个人信息。标注/填充问题请注明单位和预期尺寸。
