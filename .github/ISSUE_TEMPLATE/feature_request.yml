name: 功能建议
description: 描述需要解决的具体制图任务
title: "[Feature] "
body:
  - type: textarea
    id: task
    attributes:
      label: 希望完成什么任务
      description: 请描述输入、希望得到的图形或交互，以及当前阻碍。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 如何判断功能好用
      description: 可附期望的步骤、单位或可公开的小样例。
